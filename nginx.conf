# nginx.conf — proxy reverso com TLS para o Desk Booking
# Substitua "desk.empresa.com" pelo seu domínio real.

server {
    listen 80;
    server_name desk.empresa.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name desk.empresa.com;

    ssl_certificate     /etc/letsencrypt/live/desk.empresa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desk.empresa.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
