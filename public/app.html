<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desk Booking</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="header">
    <span class="header-brand">Desk Booking</span>
    <div class="header-user">
      <div class="header-nav" id="ti-link" style="display:none">
        <a href="/ti.html">Programação TI</a>
      </div>
      <div class="header-nav" id="admin-link" style="display:none">
        <a href="/admin.html">Painel Admin</a>
      </div>
      <span id="user-name"></span>
      <button class="btn btn-ghost btn-sm" onclick="openProfileModal()">Meu Perfil</button>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Sair</button>
    </div>
  </header>

  <div class="app-layout">
    <aside>
      <div class="card">
        <div class="card-header">Minhas Reservas</div>
        <div class="card-body">
          <ul class="booking-list" id="my-bookings">
            <li class="empty-state">Carregando...</li>
          </ul>
        </div>
      </div>
    </aside>

    <main>
      <div class="card">
        <div class="card-header">
          <div>
            Reservar Mesa
            <span style="font-size:.8rem;font-weight:400;color:var(--text-muted);margin-left:.5rem">🏢 Escritório SP — São Paulo</span>
          </div>
          <div class="view-toggle">
            <button id="btn-view-day" class="btn btn-primary btn-sm" onclick="setView('day')">Dia</button>
            <button id="btn-view-week" class="btn btn-ghost btn-sm" onclick="setView('week')">Semana</button>
          </div>
        </div>
        <div class="card-body">
          <!-- Daily view controls -->
          <div id="view-day-controls" class="date-picker-row">
            <label for="date-input" style="font-weight:500;font-size:.9rem">Data:</label>
            <input type="date" id="date-input" />
            <button class="btn btn-ghost btn-sm" onclick="loadDesks()">Atualizar</button>
          </div>
          <!-- Weekly view controls -->
          <div id="view-week-controls" class="date-picker-row" style="display:none">
            <button class="btn btn-ghost btn-sm" onclick="weekNav(-1)">&#8592;</button>
            <span id="week-label" style="font-weight:500;font-size:.9rem;min-width:160px;text-align:center"></span>
            <button class="btn btn-ghost btn-sm" onclick="weekNav(1)">&#8594;</button>
            <button class="btn btn-ghost btn-sm" onclick="goToCurrentWeek()">Hoje</button>
          </div>

          <div class="desk-grid" id="desk-grid">
            <p style="grid-column:1/-1;color:var(--text-muted)">Carregando mesas...</p>
          </div>
          <div id="week-grid-container" style="display:none"></div>

          <div class="legend">
            <div class="legend-item"><div class="legend-dot available"></div> Disponível</div>
            <div class="legend-item"><div class="legend-dot mine"></div> Minha reserva</div>
            <div class="legend-item"><div class="legend-dot booked"></div> Ocupada</div>
            <div class="legend-item"><div class="legend-dot inactive"></div> Inativa</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal: Perfil -->
  <div id="profile-modal-overlay" class="modal-overlay">
    <div class="modal-box" style="width:380px">
      <div class="modal-title">Meu Perfil</div>
      <div class="form-group">
        <label>Nome</label>
        <input type="text" id="profile-name" placeholder="Seu nome" />
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="profile-email" placeholder="seu@email.com" />
      </div>
      <div class="form-group">
        <label>Nova Senha <span style="color:var(--text-muted);font-size:.8rem">(opcional)</span></label>
        <input type="password" id="profile-password" placeholder="Deixe em branco para não alterar" />
      </div>
      <div class="form-group">
        <label>Confirmar Senha</label>
        <input type="password" id="profile-confirm-password" placeholder="Repita a nova senha" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="submitProfile()">Salvar</button>
        <button class="btn btn-ghost" onclick="closeProfileModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
