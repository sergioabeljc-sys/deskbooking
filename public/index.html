<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desk Booking</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-logos">
      <div class="auth-logo-item">
        <img
          src="/img/logo-tenda.svg"
          alt="Tenda Atacado"
          title="Tenda Atacado"
        />
      </div>
      <div class="auth-logo-divider"></div>
      <div class="auth-logo-item">
        <img
          src="/img/logo-voxcred.png"
          alt="VOXCRED"
          title="VOXCRED"
        />
      </div>
    </div>

    <div class="auth-card">
      <h1 id="form-title">Entrar</h1>
      <p id="form-subtitle">Reserve sua mesa de trabalho</p>

      <form id="auth-form">
        <div class="form-group" id="name-group" style="display:none">
          <label for="name">Nome</label>
          <input type="text" id="name" placeholder="Seu nome completo" autocomplete="name" />
        </div>
        <div class="form-group" id="setup-token-group" style="display:none">
          <label for="setup-token">Token de configuração</label>
          <input type="password" id="setup-token" placeholder="Exigido para criar o primeiro admin" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Entrar</button>
      </form>

      <div class="toggle-link">
        <span id="toggle-text">Não tem conta?</span>
        <a id="toggle-link">Criar conta</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
