<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <script>if(location.protocol==='https:')location.replace(location.href.replace(/^https:/,'http:'));</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Semana — Desk Booking</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
</head>
<body>
  <header class="header">
    <span class="header-brand">Desk Booking — Minha Semana</span>
    <div class="header-user">
      <div class="header-nav"><a href="/app.html">Reservar Mesa</a></div>
      <div class="header-nav" id="ti-link" style="display:none"><a href="/ti.html">Prog. TI</a></div>
      <div class="header-nav" id="admin-link" style="display:none"><a href="/admin.html">Admin</a></div>
      <span id="user-name"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Sair</button>
    </div>
  </header>

  <div class="admin-content" style="max-width:820px">
    <div class="card" style="margin-top:1.5rem">
      <div class="card-header">
        Minha Semana
        <div style="display:flex;gap:.5rem;align-items:center">
          <button class="btn btn-ghost btn-sm" onclick="weekNav(-1)">&#8592;</button>
          <span id="week-label" style="font-weight:500;font-size:.9rem;min-width:160px;text-align:center"></span>
          <button class="btn btn-ghost btn-sm" onclick="weekNav(1)">&#8594;</button>
          <button class="btn btn-ghost btn-sm" onclick="goCurrentWeek()">Hoje</button>
        </div>
      </div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
      <div id="week-grid" style="padding:1rem;display:grid;grid-template-columns:repeat(5,1fr);gap:.75rem">
        <p style="grid-column:1/-1;color:var(--text-muted)">Carregando...</p>
      </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/myweek.js"></script>
</body>
</html>
